# Feleke et al. 2021, Acta Neuropathologica, "Cross-platform transcriptional profiling identifies common and distinct molecular pathologies in Lewy body diseases"
# DOI 10.1007/s00401-021-02343-x; PMID 34309761; PMC8357687
# Anterior cingulate cortex; 7 control / 7 PD / 7 PDD / 7 DLB; paired snRNA-seq (205,948 nuclei) + bulk RNA-seq.
# snRNA DE = MAST per cell type, LRT with age, PMI, sex covariates (no donor random effect), |FC|>1.5, FDR<0.05.
# Bulk-only claims (differential splicing, RBP motifs) are excluded per schema and described in notes.
