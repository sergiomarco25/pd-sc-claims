<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{color-scheme:light;--bg:#f6f6f3;--panel:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#7a7975;--line:#e3e2dc;--grid:#ecebe6;
--accent:#256abf;--accent-soft:#e3edf9;--neg:#1c5cab;--mid:#f0efec;--pos:#b8322f;--brain:#efefeb;--brain2:#e6e6e1;
--good:#0ca30c;--g-know:#2a78d6;--g-bio:#eb6834;--g-src:#1baf7a;--good-soft:#8fd18f;--warn:#fab219;--none:#a3a29c;--crit:#d03b3b;--untested:#e3e2dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121211;--panel:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;
--muted:#8d8c86;--line:#33332f;--grid:#2a2a27;--accent:#86b6ef;--accent-soft:#1d2a3a;--neg:#5598e7;--mid:#383835;--pos:#e66767;
--brain:#232321;--brain2:#2b2b28;--none:#6e6d68;--untested:#2e2e2b;--good-soft:#3f7f3f;--g-know:#3987e5;--g-bio:#d95926;--g-src:#199e70}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121211;--panel:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#8d8c86;--line:#33332f;--grid:#2a2a27;
--accent:#86b6ef;--accent-soft:#1d2a3a;--neg:#5598e7;--mid:#383835;--pos:#e66767;--brain:#232321;--brain2:#2b2b28;--none:#6e6d68;--untested:#2e2e2b;--good-soft:#3f7f3f;--g-know:#3987e5;--g-bio:#d95926;--g-src:#199e70}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:8px 16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;margin-right:10px;color:var(--ink)}
nav a{color:var(--ink2);padding:5px 9px;border-radius:6px;font-size:14px}
nav a.on{background:var(--accent-soft);color:var(--accent);text-decoration:none}
.search{margin-left:auto;position:relative}
.search input{width:240px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
#sres{position:absolute;right:0;top:36px;width:360px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);display:none}
#sres div{padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}#sres div:hover{background:var(--accent-soft)}
#sres small{color:var(--muted);display:block}
main{max-width:1240px;margin:0 auto;padding:22px 16px 80px}
h1{font-size:30px;line-height:1.2;margin:6px 0 8px;letter-spacing:-.01em}
h2{font-size:21px;margin:0 0 4px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 8px;font-weight:600}
.lead{font-size:16.5px;color:var(--ink2);max-width:860px}
.sub{color:var(--muted);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0 6px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{color:var(--ink2);font-size:13px}
.findings{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;margin:12px 0}
.finding{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--accent)}
.finding:hover{border-color:var(--accent)}
.finding .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.finding .t{font-weight:600;font-size:15.5px;line-height:1.35}
.finding .d{color:var(--ink2);font-size:13.5px}
.finding .go{margin-top:auto;font-size:13px;color:var(--accent)}
.finding .mini{margin:2px 0 0}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:16px 0}
.sechead{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;margin-bottom:6px}
.sechead p{margin:2px 0 0;color:var(--ink2);font-size:14px;max-width:760px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input.f{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;max-width:100%}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.ccard:hover{border-color:var(--accent)}
.ccard .n{font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:12px;color:var(--ink2);margin:6px 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.gradient{width:160px;height:9px;border-radius:5px;display:inline-block;vertical-align:middle;margin:0 6px}
svg text{fill:var(--ink2);font-size:11.5px;font-family:inherit}
svg .lab{fill:var(--ink);font-size:12px}
svg .link{fill:var(--accent);cursor:pointer}
svg .link:hover{text-decoration:underline}
svg .ax{stroke:var(--line)}svg .gr{stroke:var(--grid)}svg .zero{stroke:var(--muted);stroke-dasharray:3 3}
[data-href]{cursor:pointer}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:1px 9px;font-size:12px;margin:2px 3px 2px 0;color:var(--ink2)}
a.chip:hover{border-color:var(--accent);text-decoration:none}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:0 7px;font-size:11.5px;font-weight:600;border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.badge i{width:8px;height:8px;border-radius:50%;display:inline-block}
.verdict{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr[data-href]:hover td{background:var(--accent-soft)}
.ctx{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:13.5px}
blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--line);color:var(--ink2);font-style:italic}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:5px 16px;font-size:14px;margin:0}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0}
.oid{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);margin-left:4px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:4px}
.matrix{font-size:12.5px}
.mrow{display:grid;grid-template-columns:132px 196px repeat(var(--nd),18px) minmax(240px,1fr);align-items:center;gap:0;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:hover{background:var(--accent-soft)}
.mrow .s{padding:4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.mcell{width:14px;height:14px;border-radius:3px;margin:2px}
.mhead{display:grid;grid-template-columns:132px 196px repeat(var(--nd),18px) minmax(240px,1fr);align-items:end;position:sticky;top:50px;background:var(--panel);z-index:2;border-bottom:1px solid var(--line)}
.mhead div.v{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;color:var(--ink2);height:96px;padding:2px 0;cursor:pointer;white-space:nowrap}
.brainviews{display:grid;gap:14px 18px;grid-template-columns:repeat(auto-fit,minmax(460px,1fr))!important}.brainviews figure{margin:0}.brainviews figcaption{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:center}
@media (max-width:900px){.brainviews{grid-template-columns:1fr!important}}
.askcard{border-color:var(--accent)}.askrow{display:flex;gap:8px;margin:8px 0}.askrow input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.askrow button,.ex{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}.askrow button{padding:8px 16px;font-weight:600;background:var(--accent);color:var(--panel);border-color:var(--accent)}
.askrow button#asks{background:var(--panel);color:var(--ink);border-color:var(--line)}
.examples{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.ex{font-size:12.5px;padding:3px 10px;color:var(--ink2)}.ex:hover{border-color:var(--accent);color:var(--accent)}
.answer{background:var(--accent-soft);border-radius:10px;padding:12px 16px;margin:10px 0;font-size:14.5px}.answer p{margin:6px 0}.answer ul{margin:4px 0 8px;padding-left:20px}.answer h4{margin:10px 0 4px}
a.cite,span.cite{display:inline-block;font-size:11.5px;padding:0 6px;border-radius:9px;background:var(--panel);border:1px solid var(--line);margin:0 1px;white-space:nowrap}
.hits{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:8px}.hit{border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:13px;background:var(--panel)}.hit:hover{border-color:var(--accent)}
.cdots{display:inline-flex;gap:2px;vertical-align:middle}.cdots i{width:7px;height:7px;border-radius:50%;border:1px solid var(--muted);display:inline-block}.cdots i.on{background:var(--ink);border-color:var(--ink)}
.qitem{border-bottom:1px solid var(--line);padding:8px 0}.qitem summary{cursor:pointer;list-style:none}.qitem summary::-webkit-details-marker{display:none}
.cgroup{margin:22px 0}.cgroup h2{margin-bottom:2px}.bgcard{border-left:4px solid var(--accent)}.refs{margin:6px 0 4px;padding-left:18px}.refs li{margin:6px 0;font-size:13.5px}
#g3{position:fixed;inset:0;z-index:40;background:var(--bg);display:none}
#g3labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}#g3labels span{position:absolute;left:0;top:0;font-size:11.5px;color:var(--ink);background:color-mix(in srgb,var(--panel) 78%,transparent);padding:0 5px;border-radius:5px;white-space:nowrap}#g3labels span.on{font-weight:700;font-size:13px}
#g3panel,#g3card{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.15);overflow:auto}
#g3panel{top:max(12px,env(safe-area-inset-top));left:12px;width:280px;max-height:calc(100vh - 24px)}#g3card{top:max(12px,env(safe-area-inset-top));right:12px;width:340px;max-height:calc(100vh - 24px);display:none}
#g3panel input.f{width:100%;margin:6px 0 4px}.g3top{display:flex;gap:10px;align-items:baseline}.g3row{display:flex;gap:6px;align-items:center;margin:3px 0;cursor:pointer}.g3row span{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.g3row i,#g3panel .g3row span i{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}.g3seg{display:flex;gap:4px;align-items:center;margin:6px 0;color:var(--muted)}.g3seg button{font:inherit;font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer}.g3seg button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
#g3panel summary,#g3card summary{cursor:pointer;margin:6px 0 2px;font-weight:600}.g3help{color:var(--muted);font-size:12px;margin:8px 0 0}.g3x{position:sticky;top:0;float:right;font:inherit;font-size:18px;line-height:1;border:none;background:none;color:var(--muted);cursor:pointer}
#g3labels span.topic{font-size:14px;font-weight:700;padding:2px 8px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent)}
#g3panel select{font:inherit;font-size:12.5px;padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);margin-left:auto;max-width:170px}
.g3legend{margin:2px 0 4px}.g3note{color:var(--muted);font-size:11.5px;margin:3px 0}.g3note i{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:-1px}
.g3path{border-top:1px solid var(--line);padding:6px 0}.g3step{color:var(--muted);font-size:12px;margin:1px 0 1px 10px}
#g3card .g3seg a{margin-right:6px}#g3pick{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--panel);padding:6px 14px;border-radius:16px;font-size:13px;display:none;z-index:2}#g3pick a{color:var(--panel);text-decoration:underline}
#g3msg{position:absolute;top:45%;left:0;right:0;text-align:center;color:var(--muted)}#g3card a.chip{cursor:pointer}
@media (max-width:700px){#g3panel{width:auto;right:12px;max-height:38vh}#g3card{top:auto;bottom:12px;left:12px;width:auto;max-height:40vh}}
.figure img{width:100%;border-radius:8px;border:1px solid var(--line);background:#fff}
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.4;max-width:340px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:none}
#tip b{font-weight:600}
.note{font-size:12.5px;color:var(--muted);margin-top:6px}
.empty{color:var(--muted);padding:18px 0}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600}
.statecard{border-left:4px solid var(--line)}
.kgwrap{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.two,.kgwrap{grid-template-columns:1fr}.search input{width:160px}h1{font-size:24px}#sres{width:300px}}
</style>

<body>
<header><div class="bar">
  <span class="brand">__BRAND__</span>
  <nav id="nav">
    <a data-v="overview" href="#overview">Overview</a><a data-v="ask" href="#ask">Ask</a><a data-v="cells" href="#cells">Cell types</a><a data-v="programmes" href="#programmes">Programmes</a><a data-v="regions" href="#regions">Brain regions</a><a data-v="consensus" href="#consensus">Consensus</a><a data-v="claims" href="#claims">Claims</a><a data-v="datasets" href="#datasets">Datasets</a><a data-v="genes" href="#genes">Genes</a><a data-v="graph" href="#graph">Graph</a>
  </nav>
  <div class="search"><input id="q" placeholder="Search claims, genes, cells, datasets…" autocomplete="off"><div id="sres"></div></div>
</div></header>
<main id="main"></main>
<div id="tip"></div>
<script>
const D = /*__DATA__*/null;
// field wording (config [atlas], claimstore.atlas); tables a field does not have are empty, and their sections and
// pages are left out: a field without biology tables gets an atlas of its claims, tests, datasets and genes
const F = D.field || {};
for (const [k, v] of Object.entries({prog: [], comp: [], region: [], spec: [], gen: [], het: [], themes: [], genes: [], gsea: [],
  anat: [], sites: {}, programmes: {}, links: {}, background: [], statements: [], relations: [], cell_order: ["ALL"]})) if (D[k] == null) D[k] = v;
const NAV_OFF = {programmes: !D.prog.length, consensus: !D.statements.length};
document.querySelectorAll("#nav a").forEach(a => { if (NAV_OFF[a.dataset.v]) a.style.display = "none"; });
const CASES = F.disease || "cases", MAIN = F.main_contrast || "case_vs_control";
// ------------------------------------------------------------------ indexes
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc = s => encodeURIComponent(s);
const $ = s => document.querySelector(s);
const split = s => (s || "").split(";").map(x => x.trim()).filter(Boolean);
const C = Object.fromEntries(D.claims.map(c => [c.id, c]));
const DS = Object.fromEntries(D.datasets.map(d => [d.dataset, d]));
const P = Object.fromEntries(D.papers.map(p => [p.id, p]));
const ST = Object.fromEntries(D.statements.map(s => [s.statement_id, s]));
const EV_C = {}, EV_D = {};
for (const e of D.evidence) { (EV_C[e.c] ??= []).push(e); (EV_D[e.d] ??= []).push(e); }
const DSORDER = D.datasets.map(d => d.dataset);
const PROG = D.programmes;
const pname = p => PROG[p]?.name || p;
const CELLS = D.cell_order;
const cname = c => c === "ALL" ? "All cells" : c;
const TESTS = Object.assign({age: "Correlation with age (Fisher z)", "post-mortem interval": "Correlation with post-mortem interval (Fisher z)"}, D.contrast_labels || {});
const OUT = {reproduced: ["Reproduced", "var(--good)"], direction_only: ["Same direction only", "var(--warn)"], not_reproduced: ["Not reproduced", "var(--none)"],
  contradicted: ["Contradicted", "var(--crit)"], not_testable: ["Not testable", "var(--untested)"]};
const OUTK = Object.keys(OUT);
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const f2 = v => v == null || isNaN(v) ? "–" : (+v).toFixed(2);
const fp = p => p == null ? "–" : p < 1e-4 ? p.toExponential(1) : (+p).toPrecision(2);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function hex2rgb(h) { h = h.replace("#", ""); if (h.length === 3) h = h.split("").map(x => x + x).join(""); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, t) { const x = hex2rgb(a), y = hex2rgb(b); return "rgb(" + x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(",") + ")"; }
function divColor(v, max) { if (v == null || isNaN(v)) return css("--untested"); const t = Math.max(-1, Math.min(1, v / max)); return t < 0 ? mix(css("--mid"), css("--neg"), -t) : mix(css("--mid"), css("--pos"), t); }
function signColor(v) { return v < 0 ? css("--neg") : css("--pos"); }
const tip = (title, rows) => `<b>${esc(title)}</b>` + (rows || []).filter(Boolean).map(r => `<br>${r}`).join("");
const attr = (t, h) => (t ? ` data-tip="${esc(t)}"` : "") + (h ? ` data-href="${esc(h)}"` : "");
const VORDER = ["Supported", "Supported (no effect)", "Partly supported", "No effect", "Inconclusive", "Contradicted", "Untested"];
const CORDER = ["High", "Moderate", "Low", "Very low"];
const VCOL = v => /^Supported/.test(v) ? "var(--good)" : /Partly/.test(v) ? "var(--warn)" : /Contradicted/.test(v) ? "var(--crit)" : /Untested/.test(v) || !v ? "var(--untested)" : "var(--none)";
const certDots = c => { const n = 4 - Math.max(0, CORDER.indexOf(c)); return `<span class="cdots" title="${esc(c || "")} certainty">${[0, 1, 2, 3].map(i => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</span>`; };
const tierOf = c => `${c.verdict || "Untested"} · ${(c.certainty || "Very low").toLowerCase()}`;
const ratingBadge = c => `<span class="badge" style="white-space:nowrap"><i style="background:${VCOL(c.verdict)}"></i>${esc(c.verdict || "Untested")}</span> ${certDots(c.certainty || "Very low")}`;
const isF = c => c.origin === "finding";
const originBadge = c => isF(c) ? `<span class="pill" style="font-size:11px">This study</span> ` : "";
const ratingScore = c => (VORDER.indexOf(c.verdict || "Untested") + 1) * 10 + CORDER.indexOf(c.certainty || "Very low");

// ------------------------------------------------------------------ chart primitives (SVG strings)
function niceMax(v) { const m = Math.max(v, 1e-6), p = Math.pow(10, Math.floor(Math.log10(m))), f = m / p; return ([1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find(x => f <= x + 1e-9)) * p; }
function ticks(lo, hi, n = 4) { const step = niceMax((hi - lo) / n); const out = []; for (let t = Math.ceil(lo / step) * step; t <= hi + 1e-9; t += step) out.push(+t.toFixed(10)); return out; }
// forest: rows {label, est, lo, hi, sig, tip, href, labelHref, note}
function forest(rows, o = {}) {
  const W = o.width || 620, LW = o.labelW || 210, RH = o.rowH || 24, top = 8, H = top + rows.length * RH + 34;

  $("#g3hits").innerHTML = q.length < 2 ? "" : KG.nodes.filter(n => !G3_HIDDEN.has(n.type) && (n.id.toLowerCase().includes(q) || n.label.toLowerCase().includes(q))).sort((a, b) => (a.type === "claim") - (b.type === "claim") || KG.adj[b.i].length - KG.adj[a.i].length)
    .slice(0, 10).map(n => `<a class="chip" data-g3go="${esc(n.id)}">${esc(g3Name(n).slice(0, 44))} <small style="color:var(--muted)">${esc(KG_TYPE[n.type])}</small></a>`).join("") || `<span class="sub">No matches</span>`;
});
document.addEventListener("click", e => {
  const go = e.target.closest("[data-g3go]"); if (go && G3.fg) { const n = KG.byId[go.dataset.g3go]; if (n && !G3_HIDDEN.has(n.type)) { G3.hideT.delete(n.type); G3.q = ""; g3Focus(G3.fg.graphData().nodes[n.i]); } return; }
  const m = e.target.closest("[data-g3mode]"); if (m) { G3.mode = m.dataset.g3mode; if (G3.mode === "meaning") G3.hideE.delete("similar"); else G3.hideE.add("similar"); g3Refresh(true); return; }
  if (e.target.id === "g3clear") { G3.path = null; g3Focus(null); }
  if (e.target.id === "g3pathbtn") { G3.pick = !G3.pick; g3Refresh(false); }
  if (e.target.id === "g3pickx") { G3.pick = false; g3Refresh(false); }
  if (e.target.id === "g3fit" && G3.fg) G3.fg.zoomToFit(1000, 40, g3NodeShown);
  if (e.target.id === "g3shot") g3Shot();
});
document.addEventListener("change", e => {
  const t = e.target.dataset?.g3t, g = e.target.dataset?.g3e, c = e.target.dataset?.g3c;
  if (t) { e.target.checked ? G3.hideT.delete(t) : G3.hideT.add(t); g3Refresh(false); }
  if (g) { e.target.checked ? G3.hideE.delete(g) : G3.hideE.add(g); g3Refresh(false); }
  if (c) { e.target.checked ? G3.hideC.delete(c) : G3.hideC.add(c); g3Refresh(false); }
  if (e.target.id === "g3scheme") { G3.scheme = e.target.value; G3.hideC.clear(); g3Refresh(false); }
  if (e.target.id === "g3lab") { G3.labels = e.target.checked; g3BuildLabels(); }
  if (e.target.id === "g3tlab") { G3.topicLabels = e.target.checked; g3BuildLabels(); }
  if (e.target.id === "g3rot") G3.rotate = e.target.checked;
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#g3")?.style.display !== "none" && (G3.focus || G3.path || G3.pick)) { G3.pick = false; G3.path = null; g3Focus(null); } });

// ------------------------------------------------------------------ router, tooltip, search
let current = "";
function rerender() { route(true); }
function route(keepScroll) {
  const raw = location.hash.slice(1) || "overview";
  const [path, qs] = raw.split("?"); const parts = path.split("/").map(decodeURIComponent);
  const params = qs ? Object.fromEntries(new URLSearchParams(qs)) : null;
  const view = parts[0], nav = {reference: "overview", cell: "cells", programme: "programmes", region: "regions", statement: "consensus", claim: "claims", dataset: "datasets", gene: "genes", graph3d: "graph"}[view] || view;
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.v === nav));
  const fn = pages[view] || pages.overview;
  const y = window.scrollY;
  $("#main").innerHTML = view === "overview" ? pages.overview() : fn(parts[1] ?? params, parts[2]);
  if (view === "claims") bindClaims();
  if (view === "ask") startQlog();
  if (view === "graph3d") show3d(parts[1]); else hide3d();
  if (keepScroll === true) window.scrollTo(0, y);
  else if (view === "overview" && parts[1]) document.getElementById(parts[1])?.scrollIntoView?.({behavior: "smooth"});
  else window.scrollTo(0, 0);
  current = raw;
}
window.addEventListener("hashchange", () => route());
document.addEventListener("click", e => { const t = e.target.closest("[data-href]"); if (t && !e.target.closest("a[href],select,input")) { location.hash = t.getAttribute("data-href").replace(/^#/, ""); } });
const tipEl = $("#tip");
document.addEventListener("mousemove", e => { const t = e.target.closest?.("[data-tip]"); if (!t) { tipEl.style.display = "none"; return; }
  tipEl.innerHTML = t.getAttribute("data-tip"); tipEl.style.display = "block";
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight; let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + h > innerHeight - 8) y = e.clientY - h - 14; tipEl.style.left = x + "px"; tipEl.style.top = y + "px"; });
const sres = $("#sres"), qin = $("#q");
qin.addEventListener("input", () => {
  const q = qin.value.trim(), ql = q.toLowerCase(); if (q.length < 2) { sres.style.display = "none"; return; }
  const out = [];
  CELLS.filter(c => cname(c).toLowerCase().includes(ql)).forEach(c => out.push([`#cell/${enc(c)}`, cname(c), "cell type"]));
  Object.keys(PROG).filter(p => pname(p).toLowerCase().includes(ql)).forEach(p => out.push([`#programme/${enc(p)}`, pname(p), "programme"]));
  Object.keys(D.sites).filter(s => s.includes(ql)).forEach(s => out.push([`#region/${enc(s)}`, s, "brain region"]));
  D.datasets.filter(d => `${d.dataset} ${d.cohort}`.toLowerCase().includes(ql)).forEach(d => out.push([`#dataset/${enc(d.dataset)}`, d.cohort, "dataset"]));
  const G = q.toUpperCase(); Object.keys(D.gene_claims).filter(g => g === G).concat([...new Set(D.genes.map(x => x.gene))].filter(g => g.startsWith(G) && g !== G).slice(0, 5)).forEach(g => out.push([`#gene/${enc(g)}`, g, "gene"]));
  D.claims.filter(c => `${c.id} ${c.statement}`.toLowerCase().includes(ql)).slice(0, 12).forEach(c => out.push([`#claim/${enc(c.id)}`, c.statement, c.id]));
  sres.innerHTML = out.slice(0, 30).map(([h, t, k]) => `<div data-go="${esc(h)}">${esc(t)}<small>${esc(k)}</small></div>`).join("") || `<div class="sub">No matches</div>`;
  sres.style.display = "block";
});
sres.addEventListener("click", e => { const t = e.target.closest("[data-go]"); if (t) { location.hash = t.dataset.go; sres.style.display = "none"; qin.value = ""; } });
document.addEventListener("click", e => { if (!e.target.closest(".search")) sres.style.display = "none"; });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => rerender());
route();
</script>
</body>
