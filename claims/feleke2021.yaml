  quote: "we identified a significantly increased proportion of microglia in all disease groups compared with the control group"
  location: "Fig. 2b; Results 'Increased proportions of microglia and vascular cells across Lewy body diseases'"
  centrality: main
  modality: snRNA
  region: cingulate
  cell_type: Microglia
  cell_state: ""
  claim_type: composition
  direction: enriched
  comparison: "PD vs control"
  genes: []
  gene_source: "Supplementary Table 2 (Scaden proportions)"
  reported_stat: "Wilcoxon rank-sum FDR<0.05; n=7 vs 7; replicated in external bulk PD dataset (Supplementary Fig. 5)"
  unit_of_analysis: donors
  method: "Scaden deconvolution of bulk RNA-seq (trained on matched snRNA) + Wilcoxon on donor proportions"
  testable_with: rna
